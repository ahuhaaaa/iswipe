name: Mise à jour des offres
on:
  schedule:
    # Minute 17 (le début d’heure est saturé chez GitHub). Toutes les 2 h, de 8 h à 20 h (heure de Paris en hiver ; 9 h à 21 h en été). Aucune exécution la nuit.
    - cron: "17 7-19/2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maj-offres
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collecteur_offres.py offers_new.json offers.json && mv offers_new.json offers.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - run: |
          git config user.name "offers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offers.json
          git commit -m "Mise à jour des offres" || exit 0
          git push
